name: Keepalive

# GitHub automatically disables scheduled (cron) workflows after 60 days
# without repository activity. This workflow makes a trivial commit well
# within that window to keep the repo "active" and prevent the other
# scheduled workflows from being auto-disabled.

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
